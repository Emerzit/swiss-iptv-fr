verification:
  ffmpeg: ffmpeg
  quality_mode: best
  max_variant_attempts: 6
  attempts: 3
  sample_seconds: 5
  http_timeout: 12
  process_timeout: 30
  source_timeout: 100
  request_delay: 1
  retry_delay: 2
publication:
  check_max_hours: 48
  review_max_days: 90
  seed_file: data/curated-sources.yaml
  review_files: [data/domestic-reviews.yaml, data/public-reviews.yaml]

# Collecte mondiale : la langue du feed, et non le pays, détermine les candidates.
# Ajouter une URL ici ne lui donne aucun droit de publication.
discovery:
  refresh_hours: 24
  http_timeout: 20
  max_input_bytes: 25000000
  download_timeout: 60
  exploration_minutes: 18
  primary_minutes: 16
  official_pages_per_run: 24
  retry_hours: 72
  preferred_countries: [CH, FR, BE, MC, CA] # Priorité de visite ; aucun autre pays n'est exclu.
  browser: tools/bin/obscura/obscura.exe # Facultatif ; rendu public, sans profil de connexion.
  rendered_pages_per_run: 4
  priority_channels: [TV5MondeEurope.fr, ORTBTV.bj, i24NEWSFrench.il, TVOnex.ch, GeneveRegionTelevision.fr]
  inputs:
    - {file: api/channels.json, url: 'https://iptv-org.github.io/api/channels.json'}
    - {file: api/feeds.json, url: 'https://iptv-org.github.io/api/feeds.json'}
    - {file: api/logos.json, url: 'https://iptv-org.github.io/api/logos.json'}
    - {file: fra.m3u, url: 'https://iptv-org.github.io/iptv/languages/fra.m3u'}
    - {file: free-tv.m3u8, url: 'https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8'}
    - {file: tvopenchfr.m3u, url: 'https://raw.githubusercontent.com/iptv-ch/iptv-ch.github.io/master/tvopenchfr.m3u'}
    - {file: netplus.m3u, url: 'https://raw.githubusercontent.com/iptv-ch/iptv-ch.github.io/master/netplus.m3u'}
    - {file: netplus.m3u8, url: 'https://raw.githubusercontent.com/iptv-ch/iptv-ch.github.io/master/netplus.m3u8'}
    - {file: webtv.m3u, url: 'https://raw.githubusercontent.com/iptv-ch/iptv-ch.github.io/master/webtv.m3u'}

