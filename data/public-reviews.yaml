  notes: 'Revue explicite de la publication d’un annuaire de liens identifiés vers les
    infrastructures publiques du diffuseur ou de son distributeur, sur demande du propriétaire
    du dépôt. Provenance et lecture CH/Sunrise documentées pour cette URL exacte ; chaîne
    en clair hors bouquet premium, sans compte, clé DRM ou modification de contrôle
    d’accès. Le site ne contient ni lecteur embarqué, ni copie de vidéo, de logo ou
    de programmes XMLTV : les champs M3U sont des références externes pour les lecteurs
    des utilisateurs. Fondement examiné : distinction des liens ordinaires et de l’incorporation
    dans la source CCdigitallaw référencée ; les conditions des sources archivées restent
    applicables. Ce classement éditorial ne constitue pas une licence des programmes,
    une permission écrite des diffuseurs ou une certification juridique universelle.
    Afficher le caractère externe des sources et limiter la description à une réception
    personnelle en Suisse ; retirer le lien en cas de restriction ou demande fondée.
    Ne publier aucune session CDN temporaire. Une URL nouvelle doit recevoir sa propre
    revue.'
